              <a href="tel:7000371321" style="display: block; margin-top: 4px; font-size: 15px; font-weight: 700; color: #8d784d; text-decoration: none; letter-spacing: 0.5px; line-height: 1.3;">7000371321</a>
            `;
            if (footer.nextElementSibling?.id !== 'acp-branding') {
              footer.insertAdjacentElement('afterend', brandBox);
            }
          }
        }
        setInterval(injectBranding, 300);
